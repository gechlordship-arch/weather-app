<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background 0.6s;
    }
    .card {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    /* Search */
    .search {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      position: relative;
    }
    .search input {
      flex: 1;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }
    .search input::placeholder { color: rgba(255,255,255,0.5); }
    .search input:focus {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.4);
    }
    .search button {
      padding: 0 18px;
      border-radius: 12px;
      border: none;
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .search button:hover { background: rgba(255,255,255,0.3); }

    /* Suggestions dropdown */
    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 6px;
      background: rgba(30,50,90,0.98);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      max-height: 260px;
      overflow-y: auto;
      z-index: 10;
      display: none;
    }
    .suggestions.show { display: block; }
    .suggestion {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-size: 14px;
      transition: background 0.15s;
    }
    .suggestion:last-child { border-bottom: none; }
    .suggestion:hover { background: rgba(255,255,255,0.1); }
    .suggestion .country {
      opacity: 0.6;
      font-size: 12px;
      margin-left: 6px;
    }
    .suggestion .admin {
      opacity: 0.5;
      font-size: 12px;
      display: block;
      margin-top: 2px;
    }

    /* Weather content */
    .location {
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .country-name {
      text-align: center;
      opacity: 0.65;
      font-size: 13px;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }
    .temp {
      font-size: 96px;
      font-weight: 200;
      text-align: center;
      line-height: 1;
      letter-spacing: -4px;
      margin: 10px 0;
    }
    .emoji {
      font-size: 68px;
      text-align: center;
      margin: 8px 0;
      line-height: 1;
    }
    .desc {
      text-align: center;
      font-size: 18px;
      opacity: 0.9;
      margin-bottom: 24px;
    }
    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding-top: 22px;
      border-top: 1px solid rgba(255,255,255,0.15);
    }
    .detail { font-size: 12px; opacity: 0.75; letter-spacing: 0.5px; }
    .detail strong {
      display: block;
      font-size: 17px;
      margin-top: 4px;
      opacity: 1;
      font-weight: 600;
      letter-spacing: 0;
    }
    .status {
      text-align: center;
      opacity: 0.75;
      font-size: 14px;
      padding: 40px 0;
    }
    .error {
      text-align: center;
      padding: 20px 0;
      font-size: 14px;
      color: #ffb4b4;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .card { padding: 24px; border-radius: 20px; }
      .temp { font-size: 76px; }
      .emoji { font-size: 56px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="search">
      <input
        id="city-input"
        placeholder="Search a city…"
        autocomplete="off">
      <button onclick="searchCity()">🔍</button>
      <div class="suggestions" id="suggestions"></div>
    </div>

    <div id="content">
      <div class="status">Loading weather…</div>
    </div>
  </div>

<script>
// ---------- Element refs ----------
const input = document.getElementById('city-input');
const suggestionsEl = document.getElementById('suggestions');
const contentEl = document.getElementById('content');

// ---------- Default city (first launch) ----------
const DEFAULT = { name: 'Addis Ababa', country: 'Ethiopia', lat: 9.03, lon: 38.74 };

// ---------- Load last city or default ----------
let current = loadSaved() || DEFAULT;

// ---------- Suggestion debounce ----------
let suggestTimer = null;

input.addEventListener('input', () => {
  clearTimeout(suggestTimer);
  const q = input.value.trim();
  if (q.length < 2) {
    suggestionsEl.classList.remove('show');
    return;
  }
  suggestTimer = setTimeout(() => fetchSuggestions(q), 280);
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    if (suggestionsEl.classList.contains('show')) {
      const first = suggestionsEl.querySelector('.suggestion');
      if (first) { first.click(); return; }
    }
    searchCity();
  }
  if (e.key === 'Escape') suggestionsEl.classList.remove('show');
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search')) suggestionsEl.classList.remove('show');
});

// ---------- Fetch suggestions from Open-Meteo geocoding ----------
async function fetchSuggestions(query) {
  try {
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=6&language=en&format=json`;
    const res = await fetch(url);
    const data = await res.json();
    const results = data.results || [];

    if (results.length === 0) {
      suggestionsEl.innerHTML = '<div class="suggestion">No matches found</div>';
      suggestionsEl.classList.add('show');
      return;
    }

    suggestionsEl.innerHTML = results.map(r => `
      <div class="suggestion" onclick='pickCity(${JSON.stringify(r).replace(/'/g, "&#39;")})'>
        <strong>${escapeHtml(r.name)}</strong>
        <span class="country">${escapeHtml(r.country || '')}</span>
        ${r.admin1 ? `<span class="admin">${escapeHtml(r.admin1)}</span>` : ''}
      </div>
    `).join('');
    suggestionsEl.classList.add('show');
  } catch (e) {
    console.error(e);
  }
}

// ---------- User picks a suggestion ----------
function pickCity(place) {
  current = {
    name: place.name,
    country: place.country || place.country_code || '',
    lat: place.latitude,
    lon: place.longitude
  };
  input.value = '';
  suggestionsEl.classList.remove('show');
  save();
  loadWeather();
}

// ---------- Fallback search (uses Enter or 🔍 button) ----------
async function searchCity() {
  const q = input.value.trim();
  if (!q) return;
  const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=en&format=json`;
  const res = await fetch(url);
  const data = await res.json();
  const r = (data.results || [])[0];
  if (!r) {
    contentEl.innerHTML = '<div class="error">❌ City not found. Try another name.</div>';
    return;
  }
  pickCity(r);
}

// ---------- Fetch & display weather ----------
async function loadWeather() {
  contentEl.innerHTML = '<div class="status">Loading weather…</div>';

  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${current.lat}&longitude=${current.lon}` +
      `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day`;
    const res = await fetch(url);
    const data = await res.json();
    const c = data.current;

    const code = c.weather_code;
    const isDay = c.is_day === 1;
    const emoji = weatherEmoji(code, isDay);
    const desc = weatherDesc(code);

    setBackground(code, isDay);

    contentEl.innerHTML = `
      <div class="location">📍 ${escapeHtml(current.name)}</div>
      <div class="country-name">${escapeHtml(current.country || '')}</div>
      <div class="emoji">${emoji}</div>
      <div class="temp">${Math.round(c.temperature_2m)}°C</div>
      <div class="desc">${desc}</div>
      <div class="details">
        <div class="detail">FEELS LIKE<strong>${Math.round(c.apparent_temperature)}°C</strong></div>
        <div class="detail">HUMIDITY<strong>${c.relative_humidity_2m}%</strong></div>
        <div class="detail">WIND<strong>${Math.round(c.wind_speed_10m)} km/h</strong></div>
        <div class="detail">UPDATED<strong>${new Date().toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'})}</strong></div>
      </div>
    `;
  } catch (e) {
    contentEl.innerHTML = '<div class="error">❌ Could not load weather. Check your internet.</div>';
  }
}

// ---------- Dynamic background based on weather ----------
function setBackground(code, isDay) {
  let bg;
  if (!isDay) {
    bg = 'linear-gradient(135deg, #0f2027, #203a43, #2c5364)';
  } else if (code === 0) {
    bg = 'linear-gradient(135deg, #2196f3, #64b5f6, #ffb74d)';
  } else if (code <= 3) {
    bg = 'linear-gradient(135deg, #1e3c72, #2a5298)';
  } else if (code <= 67) {
    bg = 'linear-gradient(135deg, #3a4a5a, #5a6a7a)';
  } else if (code <= 77) {
    bg = 'linear-gradient(135deg, #6a7a8a, #9aa8b8)';
  } else if (code <= 99) {
    bg = 'linear-gradient(135deg, #1a1a2e, #2d1b3d, #16213e)';
  } else {
    bg = 'linear-gradient(135deg, #1e3c72, #2a5298)';
  }
  document.body.style.background = bg;
}

// ---------- Weather code → emoji ----------
function weatherEmoji(code, isDay = true) {
  if (code === 0) return isDay ? '☀️' : '🌙';
  if (code <= 2) return isDay ? '🌤️' : '☁️';
  if (code === 3) return '☁️';
  if (code <= 48) return '🌫️';
  if (code <= 57) return '🌧️';
  if (code <= 67) return '🌧️';
  if (code <= 77) return '❄️';
  if (code <= 82) return '🌦️';
  if (code <= 86) return '❄️';
  if (code <= 99) return '⛈️';
  return '🌡️';
}
function weatherDesc(code) {
  if (code === 0) return 'Clear sky';
  if (code <= 2) return 'Partly cloudy';
  if (code === 3) return 'Overcast';
  if (code <= 48) return 'Foggy';
  if (code <= 57) return 'Drizzle';
  if (code <= 67) return 'Rain';
  if (code <= 77) return 'Snow';
  if (code <= 82) return 'Rain showers';
  if (code <= 86) return 'Snow showers';
  if (code <= 99) return 'Thunderstorm';
  return 'Unknown';
}

// ---------- Helpers ----------
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}
function save() {
  try { localStorage.setItem('weather_city', JSON.stringify(current)); } catch(e){}
}
function loadSaved() {
  try {
    const s = localStorage.getItem('weather_city');
    return s ? JSON.parse(s) : null;
  } catch(e) { return null; }
}

// ---------- Start ----------
input.value = '';
loadWeather();
setInterval(loadWeather, 10 * 60 * 1000); // refresh every 10 min
</script>
</body>
</html>
