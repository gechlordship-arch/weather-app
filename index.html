<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Weather</title>
  <style>
    body {
      font-family: -apple-system, Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    h1 { font-size: 22px; margin: 0 0 6px; font-weight: 600; }
    .sub { opacity: 0.7; font-size: 14px; margin-bottom: 24px; }
    .temp { font-size: 90px; font-weight: 200; margin: 10px 0; line-height: 1; }
    .emoji { font-size: 70px; margin: 10px 0; }
    .desc { font-size: 18px; opacity: 0.9; margin-bottom: 20px; }
    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.15);
    }
    .detail { font-size: 13px; }
    .detail strong { display: block; font-size: 18px; margin-top: 4px; }
    .status { opacity: 0.7; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📍 Addis Ababa</h1>
    <div class="sub">Current weather</div>
    <div id="content">
      <div class="status">Loading…</div>
    </div>
  </div>

<script>
async function loadWeather() {
  try {
    // Addis Ababa coordinates
    const lat = 9.03;
    const lon = 38.74;

    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m`;
    const res = await fetch(url);
    const data = await res.json();
    const c = data.current;

    const code = c.weather_code;
    const emoji = weatherEmoji(code);
    const desc = weatherDesc(code);

    document.getElementById('content').innerHTML = `
      <div class="emoji">${emoji}</div>
      <div class="temp">${Math.round(c.temperature_2m)}°C</div>
      <div class="desc">${desc}</div>
      <div class="details">
        <div class="detail">Feels like<strong>${Math.round(c.apparent_temperature)}°C</strong></div>
        <div class="detail">Humidity<strong>${c.relative_humidity_2m}%</strong></div>
        <div class="detail">Wind<strong>${Math.round(c.wind_speed_10m)} km/h</strong></div>
        <div class="detail">Updated<strong>${new Date().toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'})}</strong></div>
      </div>
    `;
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="status">❌ Could not load weather. Check your internet.</div>';
  }
}

function weatherEmoji(code) {
  if (code === 0) return '☀️';
  if (code <= 2) return '🌤️';
  if (code === 3) return '☁️';
  if (code <= 48) return '🌫️';
  if (code <= 57) return '🌧️';
  if (code <= 67) return '🌧️';
  if (code <= 77) return '❄️';
  if (code <= 82) return '🌦️';
  if (code <= 86) return '❄️';
  if (code <= 99) return '⛈️';
  return '🌡️';
}
function weatherDesc(code) {
  if (code === 0) return 'Clear sky';
  if (code <= 2) return 'Partly cloudy';
  if (code === 3) return 'Overcast';
  if (code <= 48) return 'Foggy';
  if (code <= 57) return 'Drizzle';
  if (code <= 67) return 'Rain';
  if (code <= 77) return 'Snow';
  if (code <= 82) return 'Rain showers';
  if (code <= 86) return 'Snow showers';
  if (code <= 99) return 'Thunderstorm';
  return 'Unknown';
}

loadWeather();
setInterval(loadWeather, 10 * 60 * 1000); // refresh every 10 min
</script>
</body>
</html>
